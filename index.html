<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UM Cottage</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f7f9fc; }
    h1 { text-align: center; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: center; }
    input { width: 90%; padding: 5px; }
    a { text-decoration: none; color: #0077cc; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>UM Cottage</h1>
  <table id="roomsTable">
    <thead>
      <tr>
        <th>Room No</th>
        <th>Tenant Name</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

<script>
const roomsData = JSON.parse(localStorage.getItem('umCottageRooms')) || 
  Array.from({length:8}, (_, i) => ({ number: i+1, tenant: '' }));

function renderRooms() {
  const tbody = document.querySelector('#roomsTable tbody');
  tbody.innerHTML = '';
  roomsData.forEach((room, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${room.number}</td>
      <td><input type="text" value="${room.tenant}" onchange="updateTenant(${i}, this.value)"></td>
      <td><a href="room${room.number}.html">View Room</a></td>
    `;
    tbody.appendChild(tr);
  });
}

function updateTenant(index, value) {
  roomsData[index].tenant = value;
  localStorage.setItem('umCottageRooms', JSON.stringify(roomsData));
}

renderRooms();
</script>
</body>
</html>
